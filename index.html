<meta charset="utf-8">
<title>SDI Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================= TOKENS ============================= */
  :root{
    --bg:#EEF1F2;
    --surface:#FFFFFF;
    --surface-2:#E4E8EA;
    --ink:#14171A;
    --ink-soft:#43505B;
    --line:#D7DCDD;
    --line-strong:#C1C8CA;
    --accent:#2A6F97;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEAF2;
    --good:#2E7D4F;
    --good-soft:#E1F0E6;
    --warn:#B8752A;
    --warn-soft:#F6E9D8;
    --bad:#B23A34;
    --bad-soft:#F7E0DE;
    --off:#8A94A0;
    --off-soft:#E9ECEE;
    --shadow: 0 1px 2px rgba(20,23,26,0.06), 0 8px 24px -12px rgba(20,23,26,0.18);
    --header-ink:#F4F5F3;
  }
  /* Theme is locked to light on purpose — no dark-mode variant is defined,
     so the page ignores the viewer's device/browser appearance setting. */

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:"Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight:700;
    letter-spacing:0.01em;
    text-wrap:balance;
    margin:0;
    color:var(--ink);
  }
  .mono, .num, table td.num, .tabular{
    font-family:"IBM Plex Mono", ui-monospace, "SF Mono", monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ============================= LAYOUT ============================= */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .topbar{
    background:#0C0F11;
    color:var(--header-ink);
    display:flex;
    align-items:center;
    gap:16px;
    padding:10px 20px;
    position:sticky; top:0; z-index:40;
    box-shadow:var(--shadow);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px);
  }
  .topbar img.logo{height:34px;display:block;}
  .topbar .org-meta{display:flex; flex-direction:column; line-height:1.15; margin-right:auto;}
  .topbar .org-name{font-family:"Big Shoulders Display",sans-serif; font-weight:700; font-size:18px; letter-spacing:0.02em;}
  .topbar .org-sub{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#A9B3B9;}
  .topbar .who{font-size:13px; color:#C8D0D4; display:flex; align-items:center; gap:10px;}
  .topbar .who strong{color:#fff; font-weight:600;}
  .btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; line-height:1.2;
    transition:background .12s ease, border-color .12s ease, transform .04s ease;
  }
  .btn:hover{border-color:var(--accent); }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--line-strong); color:var(--ink);}
  .btn-danger{color:var(--bad); border-color:var(--bad);}
  .btn-danger:hover{background:var(--bad-soft);}
  .btn-sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}
  .topbar-btn{background:transparent;border:1px solid rgba(255,255,255,0.22);color:#F4F5F3;}
  .topbar-btn:hover{border-color:#fff; background:rgba(255,255,255,0.08);}

  main{flex:1; width:100%; max-width:1180px; margin:0 auto; padding:28px 20px 64px;}
  .center-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);}
  .card-pad{padding:22px 24px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  .row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:820px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }

  .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:0.14em; color:var(--ink-soft); font-weight:600;}
  .section-title{font-size:22px; margin-bottom:2px;}
  .muted{color:var(--ink-soft);}
  hr.hairline{border:none; border-top:1px solid var(--line); margin:0;}

  .stat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .stat .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); font-weight:600;}
  .stat .stat-value{font-family:"Big Shoulders Display",sans-serif; font-size:30px; font-weight:700; margin-top:2px;}
  .stat .stat-value.good{color:var(--good);} .stat .stat-value.warn{color:var(--warn);} .stat .stat-value.bad{color:var(--bad);}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; letter-spacing:0.02em;}
  .pill-good{background:var(--good-soft); color:var(--good);}
  .pill-warn{background:var(--warn-soft); color:var(--warn);}
  .pill-bad{background:var(--bad-soft); color:var(--bad);}
  .pill-off{background:var(--off-soft); color:var(--off);}
  .pill-accent{background:var(--accent-soft); color:var(--accent);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  table{width:100%; border-collapse:collapse; min-width:640px; background:var(--surface);}
  table.compact{min-width:0;}
  th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px; white-space:nowrap;}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft); font-weight:600; background:var(--surface-2); position:sticky; top:0;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right;}
  tr.row-weekend td{color:var(--ink-soft);}
  tr.row-today{outline:2px solid var(--accent); outline-offset:-2px;}

  input[type="text"], input[type="password"], input[type="email"], input[type="time"], select, textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:7px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); width:100%;
  }
  textarea{resize:vertical; min-height:70px;}
  label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  label.field span.req{color:var(--bad);}
  label.field.autocomplete{position:relative;}

  .autocomplete-results{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50;
    background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow);
    max-height:240px; overflow-y:auto; padding:6px;
  }
  .autocomplete-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 10px; border-radius:6px; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .autocomplete-item:hover, .autocomplete-item:focus{background:var(--surface-2); outline:none;}
  .autocomplete-empty{padding:10px 10px; font-size:13px; color:var(--ink-soft);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
  .tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab .count{background:var(--surface-2); border-radius:99px; padding:1px 7px; font-size:11px; margin-left:6px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(12,15,17,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .modal{background:var(--surface); border-radius:14px; max-width:480px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line);}
  .modal-head{padding:18px 22px 0;}
  .modal-body{padding:14px 22px 22px;}
  .modal-foot{padding:0 22px 22px; display:flex; justify-content:flex-end; gap:10px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:9px; font-size:13px; box-shadow:var(--shadow); max-width:320px;}
  .toast.error{background:var(--bad);}
  .toast.success{background:var(--good);}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft);}
  .badge-shift{font-size:11px; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-soft); font-weight:600; letter-spacing:0.02em;}
  .footer-note{color:var(--ink-soft); font-size:12px; text-align:center; padding:18px 20px 8px;}

  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:inherit;font-family:inherit;}
  .divider-label{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:0.12em;}
  .divider-label::before, .divider-label::after{content:""; flex:1; height:1px; background:var(--line);}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>

/* ============================================================
   LIVE DATA (replaces the artifact/localStorage persistence layer)
   ------------------------------------------------------------
   STATE starts out as whatever was baked into this file at build time
   (below), purely so the very first paint isn't blank. DATA_READY stays
   false — render() shows a lightweight loading screen — until the first
   real fetch from Supabase lands, at which point STATE is replaced with
   live data and DATA_READY flips true. From then on, a poll every few
   seconds keeps every open device in sync with everyone else's changes.
   ============================================================ */
var DATA_READY = false;
var DATA_LOAD_ERROR = null;
var POLL_INTERVAL_MS = 7000;
var pollTimer = null;

function applyBootstrapState(data){
  STATE.orgName = data.orgName;
  STATE.primaryAdmin = data.primaryAdmin;
  STATE.admins = data.admins || [];
  STATE.adminEmails = {};
  STATE.employees = data.employees || [];
  STATE.entries = {};
  STATE.concerns = [];
  STATE.shifts = data.shifts || {};
  STATE.notifications = [];
  STATE.myNotifications = [];
}
function applyServerState(data){
  STATE.orgName = data.orgName;
  STATE.primaryAdmin = data.primaryAdmin;
  STATE.shifts = data.shifts || STATE.shifts || {};
  if(data.role === 'admin'){
    STATE.admins = data.admins || [];
    STATE.adminEmails = data.adminEmails || {};
    STATE.employees = data.employees || [];
    STATE.entries = data.entries || {};
    STATE.concerns = data.concerns || [];
    STATE.notifications = data.notifications || [];
  } else if(data.role === 'employee'){
    STATE.employees = [data.employee];
    STATE.entries = {};
    STATE.entries[data.employee.id] = data.myEntries || {};
    STATE.concerns = data.myConcerns || [];
    STATE.myNotifications = data.myNotifications || [];
  }
}

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(function(){
    if(!session.token) return;
    callApi('get-state', { token: session.token }).then(function(data){
      applyServerState(data);
      safeRender();
    }).catch(function(err){
      if(err && err.code === 'invalid_session'){
        stopPolling();
        session = { role: null, employeeId: null, adminName: null, token: null };
        saveSession();
        DATA_READY = true;
        loadInitialData();
      }
      // Any other error (offline, etc.) — just try again next tick.
    });
  }, POLL_INTERVAL_MS);
}

function loadInitialData(){
  var request;
  if(session.token && session.role){
    request = callApi('get-state', { token: session.token });
  } else {
    request = callApi('bootstrap', {});
  }
  request.then(function(data){
    DATA_READY = true;
    DATA_LOAD_ERROR = null;
    if(data.role){
      applyServerState(data);
      startPolling();
    } else {
      applyBootstrapState(data);
    }
    render();
  }).catch(function(err){
    if(err && err.code === 'invalid_session'){
      session = { role: null, employeeId: null, adminName: null, token: null };
      saveSession();
      return loadInitialData();
    }
    DATA_READY = true;
    DATA_LOAD_ERROR = 'Couldn’t reach the timesheet server. Check your internet connection and try again.';
    render();
  });
}

function esc(s){
  if(s === null || s === undefined) return '';

    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function pad2(n){ return n < 10 ? '0'+n : ''+n; }

var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
/* Contact address shown to a deactivated employee who tries to log in, and

function monthInfo(monthStr){
  var parts = monthStr.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  var days = new Date(y, m, 0).getDate();
  return { year: y, month: m, daysInMonth: days };

function dateForDay(monthStr, day){

}
function weekdayShort(monthStr, day){ return WEEKDAY_SHORT[dateForDay(monthStr, day).getDay()]; }
function weekdayLong(monthStr, day){ return WEEKDAY_LONG[dateForDay(monthStr, day).getDay()]; }
function isWeekend(monthStr, day){ var d = dateForDay(monthStr, day).getDay(); return d === 0; }
/* Matches the shift schedules from the official attendance-schedule
   template: AM works Mon–Sat, PM works Mon–Fri, EVE works Fridays only.
   Used so exports can mark a day "OFF" (outside that shift's schedule)
   the same way the template does, instead of just leaving it blank. */
function isShiftWorkDay(shift, monthStr, day){
  var dow = dateForDay(monthStr, day).getDay(); // 0=Sun..6=Sat
  return shiftWorkDays(shift).indexOf(dow) !== -1;
}
function fmtDateShort(monthStr, day){

function todayDayNum(monthStr){

/* The app has no fixed "current month" baked in — it always rolls forward

   period on screen advances on its own every month with no admin action. */

}

}
function shiftMonthKey(monthKey, delta){
  var mi = monthInfo(monthKey);
  var d = new Date(mi.year, (mi.month - 1) + delta, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);

/* Time helpers: "HH:MM" 24h strings */
function timeToMinutes(t){
  if(!t) return null;
  var parts = t.split(':');
  if(parts.length < 2) return null;
  var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h) || isNaN(m)) return null;
  return h*60+m;
}
function computeHours(timeIn, timeOut){
  var a = timeToMinutes(timeIn), b = timeToMinutes(timeOut);
  if(a === null || b === null) return { total:null, reg:null, ot:null };
  var diff = b - a;
  if(diff < 0) diff += 24*60; // overnight guard, mirrors Excel MOD()
  var total = Math.round((diff/60) * 100) / 100;
  var reg = Math.min(total, 8);
  var ot = Math.max(total - 8, 0);
  return { total: total, reg: Math.round(reg*100)/100, ot: Math.round(ot*100)/100 };
}
function fmtHrs(n){ return (n === null || n === undefined) ? '—' : n.toFixed(2); }
function nowTimeHHMM(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtTime12(t){
  if(!t) return '—';
  var mins = timeToMinutes(t);
  if(mins === null) return '—';
  var h = Math.floor(mins/60), m = mins%60;
  var ap = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + ':' + pad2(m) + ' ' + ap;
}

   ============================================================ */
function getEmployee(id){
  for(var i=0;i<STATE.employees.length;i++){ if(STATE.employees[i].id === id) return STATE.employees[i]; }
  return null;
}
function activeEmployees(){ return STATE.employees.filter(function(e){ return e.active; }); }
/* Entries are namespaced by month key so the same day-of-month number in
   two different months never collides: entries[empId][monthKey][day]. */
function getEntry(empId, monthKey, day){
  var e = STATE.entries[empId];
  if(!e) return null;
  var m = e[monthKey];
  if(!m) return null;
  return m[String(day)] || null;
}
function setEntry(empId, monthKey, day, patch){
  if(!STATE.entries[empId]) STATE.entries[empId] = {};
  if(!STATE.entries[empId][monthKey]) STATE.entries[empId][monthKey] = {};
  var cur = STATE.entries[empId][monthKey][String(day)] || { status:null, timeIn:null, timeOut:null, notes:null };
  var next = Object.assign({}, cur, patch);
  STATE.entries[empId][monthKey][String(day)] = next;
}
function monthTotals(empId, monthKey){
  var mi = monthInfo(monthKey);
  var daysPresent=0, daysAbsent=0, daysLate=0, minutesLateTotal=0, totalHrs=0, regHrs=0, otHrs=0;
  for(var d=1; d<=mi.daysInMonth; d++){
    var entry = getEntry(empId, monthKey, d);
    if(!entry) continue;
    if(entry.status === 'P') daysPresent++;
    if(entry.status === 'L'){ daysPresent++; daysLate++; minutesLateTotal += entry.minutesLate || 0; }
    if(entry.status === 'A') daysAbsent++;
    var h = computeHours(entry.timeIn, entry.timeOut);
    if(h.total !== null){ totalHrs += h.total; regHrs += h.reg; otHrs += h.ot; }
  }
  return {
    daysPresent: daysPresent, daysAbsent: daysAbsent, daysLate: daysLate, minutesLateTotal: minutesLateTotal,
    totalHrs: Math.round(totalHrs*100)/100, regHrs: Math.round(regHrs*100)/100, otHrs: Math.round(otHrs*100)/100
  };
}
function openConcernsFor(empId){
  return STATE.concerns.filter(function(c){ return c.empId === empId && c.status === 'open'; });
}
function allOpenConcerns(){
  return STATE.concerns.filter(function(c){ return c.status === 'open'; }).sort(function(a,b){ return b.submittedAt.localeCompare(a.submittedAt); });
}

/* Replaces the old artifact-publish persist(): applies an optimistic local
   mutation (same pattern as before — instant UI feedback), then calls the
   Supabase Edge Function to make it real. On failure the optimistic change
   is rolled back and an error toast explains why. On success, if the
   server handed back canonical data (e.g. a freshly generated employee id,
   or — for admin-only actions — a full re-synced state), that's merged in
   too so this tab doesn't have to wait for the next poll to see it. */
function apiPersist(action, payload, mutateFn, opts){
  opts = opts || {};
  var snapshot = JSON.parse(JSON.stringify(STATE));
  if(mutateFn){
    try{ mutateFn(STATE); }
    catch(err){
      console.error('mutation failed', err);
      toast('Something went wrong making that change.', 'error');
      return Promise.resolve(false);
    }
  }
  render(); // optimistic UI

  return callApi(action, payload).then(function(data){
    if(opts.onSuccess) opts.onSuccess(data);
    toast(opts.successMsg || 'Saved', 'success');
    return true;
  }).catch(function(err){
    STATE = snapshot;
    render();
    if(err && err.code === 'invalid_session'){
      session = { role: null, employeeId: null, adminName: null, token: null };
      saveSession();
      stopPolling();
      DATA_READY = false;
      loadInitialData();
    }
    toast(apiErrorMessage(err), 'error');
    return false;
  });
}

/* ============================================================
   CSV / DOWNLOADS
   ============================================================ */
function csvEscape(v){
  if(v === null || v === undefined) return '';
  var s = String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(rows){
  return rows.map(function(row){ return row.map(csvEscape).join(','); }).join('\r\n');
}

var DOWNLOAD_MIME = { csv: 'text/csv;charset=utf-8;', html: 'text/html;charset=utf-8;', txt: 'text/plain;charset=utf-8;', json: 'application/json;charset=utf-8;' };

/* Plain-browser fallback: a Blob + temporary <a download> click. Only used
   when SELF_HOSTED — inside the claude.ai artifact viewer this kind of
   script-driven download is sandboxed and does nothing, so downloadsCap
   (the real platform capability) is the only path there. */
function downloadViaBlob(baseName, content, ext){
  try{
    var blob = new Blob([content], { type: DOWNLOAD_MIME[ext] || DOWNLOAD_MIME.txt });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = baseName + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Downloaded ' + baseName + '.' + ext, 'success');
  }catch(err){
    toast('Couldn’t save the file in this browser.', 'error');
  }
}

function offerDownload(baseName, content, ext){
  ext = ext || 'csv';
  if(!downloadsCap){
    if(SELF_HOSTED){ downloadViaBlob(baseName, content, ext); return; }
    toast('File downloads aren’t available in this view.', 'error');
    return;
  }
  downloadsCap.save({ filename: baseName + '.' + ext, data: content }).then(function(){
    toast('Downloaded ' + baseName + '.' + ext, 'success');
  }).catch(function(err){
    var code = err && err.code;
    if(code === 'extension_not_enabled' || code === 'rejected_extension'){
      downloadsCap.save({ filename: baseName + '.txt', data: content }).then(function(){
        toast('Downloaded ' + baseName + '.txt', 'success');
      }).catch(function(){
        toast('Couldn’t save the file in this view.', 'error');
      });
      return;
    }
    if(code === 'declined') return;
    if(code === 'too_large'){ toast('That file is too large to download here.', 'error'); return; }
    toast('Couldn’t save the file in this view.', 'error');
  });
}

/* Excel-openable export: a real HTML <table> with inline styles (colors,
   borders, merged headers via colspan) that mirrors Ken's official
   templates visually — not just column labels. Saved with a .html
   extension (the claude.ai download capability has no .xlsx in its

   well-supported way to ship an "Excel-style" export without a server. */
function excelHTMLDoc(title, tableHTML){
  return '<!doctype html><html><head><meta charset="utf-8">' +
    '<title>' + esc(title) + '</title></head>' +
    '<body style="margin:0;padding:16px;background:#fff;">' +
    '<table style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">' +
    tableHTML +
    '</table></body></html>';
}
function xlTd(content, style, colspan){
  return '<td' + (colspan?' colspan="'+colspan+'"':'') + ' style="' + style + '">' + content + '</td>';
}

/* The company-wide Summary doesn't correspond to anything in either
   official SDI template (it's our own bonus roll-up), so there's no
   template to match. It's still built as a styled HTML table, like every
   other export, for a consistent look across all Downloads-tab exports —
   see allEmployeesSummaryExcelHTML() further down, near the other

/* Matches the attendance-schedule template's own section order and banner
   wording exactly (PM, then AM, then Evening) rather than alphabetizing
   the shift codes. */
var ATTENDANCE_GROUP_BANNER = {
  PM:  '12:00 PM – 5:00 PM   |   Monday to Friday',
  AM:  '10:00 AM – 5:00 PM   |   Monday to Saturday',
  EVE: '4:00 PM – 8:00 PM   |   Fridays Only'
};
/* PM, then AM, then Evening — matches the paper template's wording
   exactly rather than alphabetizing. Any shift an admin adds beyond
   these three original ones is appended after, in whatever order it
   loads, with a banner generated from its own schedule label so new
   shifts still show up in this export instead of silently vanishing. */
function attendanceGroupOrder(){
  var codes = shiftCodes();
  var base = ['PM','AM','EVE'].filter(function(c){ return codes.indexOf(c) !== -1; });
  var extra = codes.filter(function(c){ return base.indexOf(c) === -1; });
  return base.concat(extra);
}
function attendanceGroupBanner(code){
  return ATTENDANCE_GROUP_BANNER[code] || (shiftScheduleLabel(code) || shiftName(code));
}

/* ============================================================

var XL = {

function formatName(name){
  if(!name) return '';
  return String(name).split(' ').map(function(w){
    if(/^[A-Za-z]\.$/.test(w)) return w.toUpperCase();
    if(w.length === 0) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}
function sortedActiveEmployees(){
  return activeEmployees().slice().sort(function(a,b){ return formatName(a.name).localeCompare(formatName(b.name)); });
}
/* Employee names aren't stored in one consistent format — some are
   "Surname, First Middle" (comma-separated), others are plain
   "First Middle Surname" with no comma at all. To sort a mixed list by
   surname regardless of which style a given record uses: if there's a
   comma, the surname is whatever comes before it; if not, the surname is
   assumed to be the last word (matches how the non-comma names in this
   data are actually ordered — e.g. "ENRIQUE SAURO" -> Sauro). */
function surnameOf(name){
  var n = String(name||'').trim();
  if(!n) return '';
  var comma = n.indexOf(',');
  if(comma !== -1) return n.slice(0, comma).trim();
  var parts = n.split(/\s+/);
  return parts[parts.length-1];
}

var SHIFT_LABELS = { AM: '10:00 AM – 5:00 PM (Mon–Sat)', PM: '12:00 PM – 5:00 PM (Mon–Fri)', EVE: '4:00 PM – 8:00 PM (Fridays)' };
var LEGACY_WORK_DAYS = { AM: [1,2,3,4,5,6], PM: [1,2,3,4,5], EVE: [5] };
var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* Shifts are admin-defined and live server-side in STATE.shifts (keyed by
   code): name, schedule label, required clock-in time, and which days of
   the week the shift runs (workDays, 0=Sun..6=Sat). Admins can rename any
   shift, edit its schedule/required time, and add brand-new shifts from
   People & Access -> Shift Settings — nothing about AM/PM/EVE is special
   at the code level any more. shiftCodes() reflects whatever's currently
   loaded (ordered by the server's sortOrder), falling back to the
   original AM/PM/EVE trio before the first server response arrives so
   the UI has something to render immediately; isShiftWorkDay() falls
   back to the original hardcoded Mon-Sat/Mon-Fri/Fridays-only pattern
   for those three specific codes if workDays hasn't loaded yet either. */
function shiftCodes(){
  if(STATE.shifts && Object.keys(STATE.shifts).length){
    return Object.keys(STATE.shifts).sort(function(a,b){
      var oa = shiftInfo(a).sortOrder, ob = shiftInfo(b).sortOrder;
      if(oa != null && ob != null && oa !== ob) return oa - ob;
      return a < b ? -1 : a > b ? 1 : 0;
    });
  }
  return ['AM', 'PM', 'EVE'];
}
function shiftInfo(code){ return (STATE.shifts && STATE.shifts[code]) || {}; }
function shiftName(code){ return shiftInfo(code).name || code; }
function shiftScheduleLabel(code){ return shiftInfo(code).scheduleLabel || SHIFT_LABELS[code] || ''; }
function shiftRequiredTimeIn(code){ return shiftInfo(code).requiredTimeIn || null; }
function toMinutesOfDay(hhmm){
  if(!hhmm) return null;
  var p = String(hhmm).split(':');
  var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  if(isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function shiftWorkDays(code){
  var wd = shiftInfo(code).workDays;
  if(Array.isArray(wd) && wd.length) return wd.slice();
  return (LEGACY_WORK_DAYS[code] || [1,2,3,4,5,6]).slice();
}
function shiftWorkDaysLabel(code){
  var days = shiftWorkDays(code).slice().sort(function(a,b){ return a-b; });
  if(!days.length) return '—';
  if(days.length === 7) return 'Every day';
  // Compress consecutive runs (e.g. 1,2,3,4,5,6 -> "Mon–Sat") for
  // readability; non-consecutive selections just get comma-joined.
  var runs = [], start = days[0], prev = days[0];
  for(var i=1; i<=days.length; i++){
    var d = days[i];
    if(d === prev + 1){ prev = d; continue; }
    runs.push(start === prev ? DOW_SHORT[start] : DOW_SHORT[start] + '–' + DOW_SHORT[prev]);
    start = prev = d;
  }
  return runs.join(', ');
}

}

/* Both employee-search boxes (this one and the landing page's) wait for at
   least this many characters before showing any results — no full-list
   dump on focus, and no results for a single stray keystroke. */
var SEARCH_MIN_CHARS = 3;

/* Renders the filtered/full employee list into the admin search's results
   dropdown, grouped visually via the shift badge on each row. Called
   directly on input/focus — never goes through render(), so the search
   box never loses focus or cursor position while typing. */
function renderAdminEmpResults(query){
  var box = $('admin-emp-results');
  if(!box) return;
  var q = (query || '').trim().toLowerCase();
  if(q.length < SEARCH_MIN_CHARS){
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  var emps = sortedActiveEmployees();
  var matches = emps.filter(function(e){ return formatName(e.name).toLowerCase().indexOf(q) !== -1; });
  if(!matches.length){
    box.innerHTML = '<div class="autocomplete-empty">No matching name</div>';
    box.hidden = false;
    return;
  }
  box.innerHTML = matches.map(function(e){
    return '<div class="autocomplete-item" data-emp-id="' + esc(e.id) + '" tabindex="0">' +
      '<span>' + esc(formatName(e.name)) + '</span>' +
      '<span class="badge-shift">' + esc(shiftName(e.shift)) + '</span>' +
    '</div>';
  }).join('');
  box.hidden = false;
}

function renderLoadingHTML(){
  return '<div class="center-wrap" style="padding-top:80px;">' +
    '<div class="card card-pad stack" style="max-width:380px; width:100%; text-align:center; align-items:center;">' +
      '<h1 class="section-title" style="font-size:20px; margin:0;">Loading your timesheet…</h1>' +
      '<p class="muted" style="margin:0;">Connecting to the server.</p>' +
    '</div></div>';
}
function render(){
  var app = $('app');
  if(!app) return;
  if(!DATA_READY){
    app.innerHTML = renderLoadingHTML();
    return;
  }
  if(DATA_LOAD_ERROR){
    app.innerHTML = renderFatalErrorHTML(DATA_LOAD_ERROR);
    return;
  }
  // Guard the whole render: if any view function throws (a bad state shape,
  // an unexpected edge case), fall back to a clear "something went wrong"
  // screen instead of leaving a blank or half-drawn page on screen.
  try{
    var html = renderHeader() + '<main>' + renderMain() + '</main>' + renderFooter();
    app.innerHTML = html;
    if(ui.modal) renderModalInto(app);
    wireInputsAfterRender();
  }catch(err){
    console.error('SDI Timesheet: render failed', err);
    try{ app.innerHTML = renderFatalErrorHTML('Something went wrong showing this page.'); }catch(e2){ /* give up quietly */ }
  }
}

function renderFatalErrorHTML(detail){
  return '<div class="center-wrap" style="padding-top:60px;">' +
    '<div class="card card-pad stack" style="max-width:440px; width:100%; text-align:center; align-items:center;">' +

function renderMain(){
  if(session.role === 'employee'){
    var emp = getEmployee(session.employeeId);
    if(emp && !emp.active){
      // Deactivated while they were logged in (e.g. an admin turned this
      // off mid-session) — same "email for reactivation" message as trying
      // to log back in, not a silent bounce to the landing page.
      session = { role: null, employeeId: null, adminName: null }; saveSession();
      ui.modal = 'accountInactive'; ui.modalData = {};
      return viewLanding();
    }
    if(!emp){ session = { role: null, employeeId: null, adminName: null }; saveSession(); return viewLanding(); }
    return viewEmployeeDash(emp);
  }
  if(session.role === 'employee-setup'){
    var setupEmp = getEmployee(session.pendingEmployeeId);
    if(!setupEmp){ session = { role: null, employeeId: null, adminName: null }; saveSession(); return viewLanding(); }
    return viewEmployeeSetup(setupEmp);
  }
  if(session.role === 'employee-auth'){
    var authEmp = getEmployee(session.pendingEmployeeId);
    if(!authEmp){ session = { role: null, employeeId: null, adminName: null }; saveSession(); return viewLanding(); }
    return viewEmployeeAuth(authEmp);
  }
  if(session.role === 'admin-login'){
    return viewAdminLogin();
  }
  if(session.role === 'admin'){
    if(STATE.admins.indexOf(session.adminName) === -1){ session = { role: null, employeeId: null, adminName: null }; saveSession(); return viewLanding(); }
    return viewAdminDash();
  }
  return viewLanding();
}

/* Renders the filtered/full employee list into the landing search's results
   dropdown. Called directly on input/focus — never goes through render(),
   so the search box never loses focus or cursor position while typing. */
function renderLandingResults(query){
  var box = $('landing-emp-results');
  if(!box) return;
  var q = (query || '').trim().toLowerCase();
  if(q.length < SEARCH_MIN_CHARS){
    // Fewer than SEARCH_MIN_CHARS typed — stay closed. Only show results
    // once there's enough of a name to actually narrow things down, not a
    // full list to scroll through or a match on one stray keystroke.
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  // Inactive employees are deliberately included here (unlike the admin's
  // Edit Entries search) so someone who's been deactivated can still find
  // their own name and get told to email for reactivation, instead of
  // just silently not appearing with no explanation. See v22.
  var emps = STATE.employees.slice().sort(function(a,b){ return formatName(a.name).localeCompare(formatName(b.name)); });
  var matches = emps.filter(function(e){ return formatName(e.name).toLowerCase().indexOf(q) !== -1; });
  if(!matches.length){
    box.innerHTML = '<div class="autocomplete-empty">No matching name</div>';
    box.hidden = false;
    return;
  }
  box.innerHTML = matches.map(function(e){
    var badge = e.active ? ('<span class="badge-shift">' + esc(shiftName(e.shift)) + '</span>') : '<span class="pill pill-off">Inactive</span>';
    return '<div class="autocomplete-item" data-emp-id="' + esc(e.id) + '" tabindex="0">' +
      '<span>' + esc(formatName(e.name)) + '</span>' +
      badge +
    '</div>';
  }).join('');
  box.hidden = false;
}

function pickLandingEmployee(empId){
  var emp = getEmployee(empId);
  if(!emp) return;
  ui.landingSearch.selectedId = emp.id;
  ui.landingSearch.query = formatName(emp.name);
  ui.landingSearch.error = null;
  var input = $('landing-emp-search');
  var hidden = $('landing-emp-selected-id');
  var box = $('landing-emp-results');
  if(input) input.value = formatName(emp.name);
  if(hidden) hidden.value = emp.id;
  if(box){ box.hidden = true; box.innerHTML = ''; }
}

/* Today's clock-in/clock-out card — only meaningful when the employee is
   looking at the current month, since punching a past or future day
   doesn't make sense. Employees can only ever punch *today*; any other
   correction still has to go through an admin (Edit Entries) or a
   flagged concern, same as before. */
function punchCardHTML(emp, monthKey, today){
  if(monthKey !== currentMonthKey() || today === -1) return '';
  var entry = getEntry(emp.id, monthKey, today) || {};
  var dateLabel = fmtDateShort(monthKey, today) + ' · ' + weekdayLong(monthKey, today);

  if(!entry.timeIn){
    return '<div class="card card-pad row punch-card" style="justify-content:space-between;">' +
      '<div>' +
        '<div class="eyebrow">Today — ' + esc(dateLabel) + '</div>' +
        '<div class="muted" style="font-size:13px;">You haven’t clocked in yet.</div>' +
      '</div>' +
      '<button class="btn btn-primary" data-action="punch-time-in">Time In</button>' +
    '</div>';
  }
  if(entry.timeIn && !entry.timeOut){
    return '<div class="card card-pad row punch-card" style="justify-content:space-between;">' +
      '<div>' +
        '<div class="eyebrow">Today — ' + esc(dateLabel) + '</div>' +
        '<div class="row" style="gap:8px; align-items:center; font-size:13px;">Clocked in at <strong>' + esc(fmtTime12(entry.timeIn)) + '</strong>' + (entry.status === 'L' ? statusPillHTML('L', entry.minutesLate) : '') + '</div>' +
      '</div>' +
      '<button class="btn btn-primary" data-action="punch-time-out">Time Out</button>' +
    '</div>';
  }
  var h = computeHours(entry.timeIn, entry.timeOut);
  return '<div class="card card-pad row punch-card" style="justify-content:space-between;">' +
    '<div>' +
      '<div class="eyebrow">Today — ' + esc(dateLabel) + '</div>' +
      '<div style="font-size:13px;">Clocked <strong>' + esc(fmtTime12(entry.timeIn)) + '</strong> – <strong>' + esc(fmtTime12(entry.timeOut)) + '</strong> · ' + esc(fmtHrs(h.total)) + ' hrs</div>' +
    '</div>' +
    '<span class="pill pill-good">Done for today</span>' +
  '</div>';
}

/* ============================================================
   VIEW: EMPLOYEE DASHBOARD
   ============================================================ */
function viewEmployeeDash(emp){
  var monthKey = empMonth();
  var mi = monthInfo(monthKey);
  var t = monthTotals(emp.id, monthKey);
  var today = todayDayNum(monthKey);
  var myConcerns = STATE.concerns.filter(function(c){ return c.empId === emp.id; }).sort(function(a,b){ return b.submittedAt.localeCompare(a.submittedAt); });

  var rows = '';
  for(var d=1; d<=mi.daysInMonth; d++){
    var entry = getEntry(emp.id, monthKey, d) || {};
    var h = computeHours(entry.timeIn, entry.timeOut);
    var statusPill = statusPillHTML(entry.status, entry.minutesLate);
    var weekendCls = isWeekend(monthKey, d) ? ' row-weekend' : '';
    var todayCls = (d === today) ? ' row-today' : '';
    var hasConcernOpen = myConcerns.some(function(c){ return c.day === d && c.month === monthKey && c.status === 'open'; });
    rows += '<tr class="' + (weekendCls+todayCls).trim() + '">' +
      '<td>' + esc(fmtDateShort(monthKey, d)) + '</td>' +
      '<td class="muted">' + esc(weekdayShort(monthKey, d)) + '</td>' +
      '<td>' + statusPill + '</td>' +
      '<td class="num mono">' + esc(entry.timeIn ? fmtTime12(entry.timeIn) : '—') + '</td>' +
      '<td class="num mono">' + esc(entry.timeOut ? fmtTime12(entry.timeOut) : '—') + '</td>' +
      '<td class="num mono">' + esc(fmtHrs(h.total)) + '</td>' +
      '<td class="num mono">' + esc(fmtHrs(h.reg)) + '</td>' +
      '<td class="num mono">' + (h.ot ? '<span class="pill pill-warn">' + esc(fmtHrs(h.ot)) + '</span>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + esc(entry.notes || '') + '</td>' +
      '<td>' + (hasConcernOpen
          ? '<span class="pill pill-bad">Flagged</span>'
          : '<button class="btn btn-sm btn-ghost" data-action="open-concern-modal" data-day="' + d + '">Flag issue</button>') +
      '</td>' +
    '</tr>';
  }

  var concernsList = myConcerns.length ? myConcerns.map(concernRowHTML).join('') : '<p class="empty">No concerns filed yet.</p>';

  var myRequests = (STATE.myNotifications || []).filter(function(n){
    return n.type === 'late' || n.type === 'absence' || n.type === 'sick_leave' || n.type === 'vacation_leave';
  }).sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
  var myRequestsList = myRequests.length ? myRequests.map(myRequestRowHTML).join('') : '<p class="empty">No requests sent yet.</p>';

  return '' +
  '<div class="stack" style="gap:24px;">' +
    '<div class="row" style="justify-content:space-between; align-items:flex-end;">' +
      '<div>' +
        '<span class="eyebrow">' + esc(emp.department || '') + ' · ' + esc(emp.position || '') + '</span>' +
        '<h1 class="section-title" style="font-size:28px;">' + esc(formatName(emp.name)) + '</h1>' +
        '<p class="muted" style="margin:2px 0 0;">' + esc(emp.shiftLabel || '') + ' · Manager: ' + esc(formatName(emp.manager || '')) + '</p>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn btn-sm" data-action="download-my-timesheet">Download Timesheet</button>' +
        '<button class="btn btn-sm" data-action="download-my-attendance">Download Attendance</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="notify-admin-open">Notify Admin</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="change-passcode-open">Change Passcode</button>' +
      '</div>' +
    '</div>' +

    punchCardHTML(emp, monthKey, today) +

    '<div class="grid grid-4">' +
      statCard('Days Present', t.daysPresent, 'good') +
      statCard('Days Absent', t.daysAbsent, t.daysAbsent > 0 ? 'bad' : '') +
      statCard('Reg Hours', fmtHrs(t.regHrs), '') +
      statCard('OT Hours', fmtHrs(t.otHrs), t.otHrs > 0 ? 'warn' : '') +
    '</div>' +

    '<div class="card">' +
      '<div class="card-pad row" style="justify-content:space-between; padding-bottom:12px;">' +
        '<h2 style="font-size:18px;">Daily record</h2>' +
        monthNavHTML('employee', monthKey) +
      '</div>' +
      '<div class="table-wrap" style="border:none; border-radius:0; border-top:1px solid var(--line);">' +
        '<table>' +
          '<thead><tr><th>Date</th><th>Day</th><th>Status</th><th class="num">Time In</th><th class="num">Time Out</th><th class="num">Total</th><th class="num">Reg</th><th class="num">OT</th><th>Notes</th><th>Concern</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>' +

    '<div class="card card-pad stack">' +
      '<h2 style="font-size:18px;">My concerns</h2>' +
      '<p class="muted" style="margin:-8px 0 0; font-size:12.5px;">Flag a day that looks wrong and ' + esc(STATE.primaryAdmin) + ' will review it.</p>' +
      concernsList +
    '</div>' +

    '<div class="card card-pad stack">' +
      '<h2 style="font-size:18px;">My requests</h2>' +
      '<p class="muted" style="margin:-8px 0 0; font-size:12.5px;">Late, absence, sick leave and vacation leave requests you\'ve sent to ' + esc(STATE.primaryAdmin) + '. Vacation leave needs Management approval; the rest are just for their records.</p>' +
      myRequestsList +
    '</div>' +
  '</div>';
}

function statusPillHTML(status, minutesLate){
  if(status === 'P') return '<span class="pill pill-good">Present</span>';
  if(status === 'L') return '<span class="pill pill-warn">Late' + (minutesLate ? ' · ' + minutesLate + 'm' : '') + '</span>';
  if(status === 'A') return '<span class="pill pill-bad">Absent</span>';
  if(status === 'OFF') return '<span class="pill pill-off">Off</span>';
  return '<span class="pill pill-off">—</span>';
}

function concernRowHTML(c){
  var emp = getEmployee(c.empId);
  var statusPill = c.status === 'open' ? '<span class="pill pill-warn">Open</span>' : '<span class="pill pill-good">Resolved</span>';
  return '' +
  '<div class="card-pad" style="border:1px solid var(--line); border-radius:10px; padding:14px 16px;">' +
    '<div class="row" style="justify-content:space-between; align-items:flex-start;">' +
      '<div>' +
        '<div style="font-weight:600; font-size:13.5px;">' + esc(fmtDateShort(c.month, c.day) + ' ' + monthInfo(c.month).year) + (emp ? ' · ' + esc(formatName(emp.name)) : '') + '</div>' +
        '<div class="muted" style="font-size:12.5px; margin-top:2px;">' + esc(c.message) + '</div>' +
        (c.adminReply ? '<div style="font-size:12.5px; margin-top:8px; padding:8px 10px; background:var(--surface-2); border-radius:7px;"><strong>Reply:</strong> ' + esc(c.adminReply) + '</div>' : '') +
      '</div>' +
      statusPill +
    '</div>' +
  '</div>';
}

function myRequestRowHTML(n){
  var statusPill = n.type === 'vacation_leave'
    ? (n.status === 'approved' ? '<span class="pill pill-good">Approved</span>'
      : n.status === 'denied' ? '<span class="pill pill-bad">Denied</span>'
      : '<span class="pill pill-warn">Awaiting approval</span>')
    : (n.read ? '<span class="pill pill-good">Seen</span>' : '<span class="pill pill-warn">Sent</span>');
  var dateRange = (n.startDate || n.endDate)
    ? '<div class="muted" style="font-size:12px; margin-top:2px;">' + esc(n.startDate || '?') + ' – ' + esc(n.endDate || '?') + '</div>'
    : '';
  return '' +
  '<div class="card-pad" style="border:1px solid var(--line); border-radius:10px; padding:14px 16px;">' +
    '<div class="row" style="justify-content:space-between; align-items:flex-start;">' +
      '<div>' +
        '<div class="row" style="gap:8px; align-items:center;">' + notifTypePillHTML(n.type) + '<span class="muted" style="font-size:11px;">' + esc(fmtNotifWhen(n.createdAt)) + '</span></div>' +
        '<div style="font-size:13px; margin-top:4px;">' + esc(n.message || '') + '</div>' +
        dateRange +
        (n.adminReply ? '<div style="font-size:12.5px; margin-top:8px; padding:8px 10px; background:var(--surface-2); border-radius:7px;"><strong>Reply:</strong> ' + esc(n.adminReply) + '</div>' : '') +
      '</div>' +
      statusPill +
    '</div>' +
  '</div>';
}

function statCard(label, value, kind){
  return '<div class="stat"><div class="stat-label">' + esc(label) + '</div><div class="stat-value' + (kind ? ' ' + kind : '') + '">' + esc(value) + '</div></div>';

/* ============================================================
   VIEW: ADMIN DASHBOARD
   ============================================================ */
function unreadNotificationCount(){
  return (STATE.notifications || []).filter(function(n){ return !n.read; }).length;
}
function viewAdminDash(){
  var openCount = allOpenConcerns().length;
  var unreadCount = unreadNotificationCount();
  var tabs = [
    ['overview','Overview'],
    ['entries','Edit Entries'],
    ['concerns','Concerns', openCount],
    ['notifications','Notifications', unreadCount],
    ['people','People & Access'],
    ['downloads','Downloads']
  ];
  var tabsHTML = tabs.map(function(t){
    var active = ui.adminTab === t[0] ? ' active' : '';
    var count = t[2] ? '<span class="count">' + t[2] + '</span>' : '';
    return '<button class="tab' + active + '" data-action="admin-tab" data-tab="' + t[0] + '">' + t[1] + count + '</button>';
  }).join('');

  var body = '';
  if(ui.adminTab === 'entries') body = adminEntriesTab();
  else if(ui.adminTab === 'concerns') body = adminConcernsTab();
  else if(ui.adminTab === 'notifications') body = adminNotificationsTab();
  else if(ui.adminTab === 'people') body = adminPeopleTab();
  else if(ui.adminTab === 'downloads') body = adminDownloadsTab();
  else body = adminOverviewTab();

  return '<div class="stack" style="gap:18px;">' +
    '<div class="row" style="justify-content:space-between; align-items:flex-end;">' +
      '<div><span class="eyebrow">Admin</span><h1 class="section-title" style="font-size:26px;">' + esc(STATE.orgName) + '</h1></div>' +
      monthNavHTML('admin', adminMonth()) +

/* A native <input type="time"> only lets you cycle its hour spinner
   1–12 (or 00–23 in 24-hour locales) — there's no "0"/blank stop on the
   dial itself, so once a time is set, clearing it back out again isn't
   obvious (it depends on a tiny, easy-to-miss browser-native "x" that
   some browsers don't even show). Ken hit exactly this trying to clear
   a Time In. Fixing it the honest way: keep the native time input (still
   the best editing widget for this on both desktop and mobile) and pair
   it with an explicit, always-visible Clear button that blanks the field
   directly — no hunting for a hidden control. See v24 below. */
function timeFieldHTML(cls, value){
  return '<div class="row" style="gap:4px; flex-wrap:nowrap; align-items:center;">' +
      '<input type="time" class="' + cls + '" value="' + esc(value || '') + '" style="min-width:110px;">' +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="clear-time-field" title="Clear this time" aria-label="Clear this time" style="padding:5px 9px;">&times;</button>' +
    '</div>';
}
function adminEntriesTab(){
  var monthKey = adminMonth();
  var emps = sortedActiveEmployees();
  var emp = getEmployee(ui.adminEmpId);
  // v23–v29 used to auto-pick the first employee here whenever nothing
  // was selected, so this tab always showed *someone's* timesheet. Ken
  // asked (v30) for that to stop: no employee's entries should be on
  // screen until one is actually picked from the search box above, so
  // there's no chance of silently editing the wrong person's data.
  // A previously-selected employee who gets deleted/deactivated out
  // from under this tab (the v22 edge case) is handled the same way —
  // the stale id is cleared rather than snapping to some other
  // employee nobody asked for, which is just as surprising as the old
  // "No employees yet" crash it was originally meant to avoid.
  if(ui.adminEmpId && (!emp || !emp.active)){
    ui.adminEmpId = null;
    emp = null;
  }

  if(!emp){
    return '<div class="stack">' +
      adminEmpSearchHTML(null) +
      '<p class="empty">' + (emps.length ? 'Search for an employee above to view or edit their timesheet.' : 'No employees yet.') + '</p>' +
    '</div>';
  }

  var mi = monthInfo(monthKey);
  var rows = '';
  for(var d=1; d<=mi.daysInMonth; d++){
    var entry = getEntry(emp.id, monthKey, d) || {};
    var weekendCls = isWeekend(monthKey, d) ? ' row-weekend' : '';
    rows += '<tr class="' + weekendCls.trim() + '" data-day="' + d + '">' +
      '<td>' + esc(fmtDateShort(monthKey, d)) + '</td>' +
      '<td class="muted">' + esc(weekdayShort(monthKey, d)) + '</td>' +
      '<td><select class="entry-status" style="min-width:90px;">' +
        ['', 'P','L','A','OFF'].map(function(s){
          var sel = (entry.status || '') === s ? ' selected' : '';
          var opt = s === 'L' ? 'Late' : (s || '—');
          return '<option value="' + s + '"' + sel + '>' + opt + '</option>';
        }).join('') +
      '</select></td>' +
      '<td>' + timeFieldHTML('entry-timein', entry.timeIn) + '</td>' +
      '<td>' + timeFieldHTML('entry-timeout', entry.timeOut) + '</td>' +
      '<td><input type="number" min="0" class="entry-minlate" value="' + esc(entry.minutesLate != null ? entry.minutesLate : '') + '" placeholder="—" style="width:64px;" title="Minutes late (only used when Status is Late)"></td>' +
      '<td><input type="text" class="entry-notes" value="' + esc(entry.notes || '') + '" placeholder="—" style="min-width:140px;"></td>' +
      '<td><button type="button" class="btn btn-sm btn-ghost" data-action="clear-entry-row" title="Clear status, times and notes for this day">Clear day</button></td>' +
    '</tr>';
  }

  return '<div class="stack">' +
    '<div class="row" style="justify-content:space-between; align-items:flex-end;">' +
      adminEmpSearchHTML(emp) +
      '<button class="btn btn-primary" data-action="save-entries">Save Changes</button>' +
    '</div>' +
    '<p class="muted" style="margin:0; font-size:12.5px;">Set status, time in/out and notes for each day, then Save Changes. Total, Reg and OT hours are calculated automatically. A time in past this employee\'s shift\'s required time in (set in People &amp; Access) is automatically marked Late with minutes calculated for you, same as when the employee clocks in themselves — no need to pick Late by hand. Type your own number into Min Late alongside picking Late yourself only if you want to override that calculation. Use × to clear just a time, or "Clear day" to blank the whole row.</p>' +
    '<div class="table-wrap">' +
      '<table id="entries-editor-table">' +
        '<thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Time In</th><th>Time Out</th><th>Min Late</th><th>Notes</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>' +
  '</div>';
}

        '<div>' +

/* ============================================================
   ADMIN: NOTIFICATIONS
   ------------------------------------------------------------
   One feed for everything that used to have no single home: system
   events (a punch, a passcode being set/changed, an auto-detected late
   arrival) plus employee-submitted requests (late heads-up, absence,
   sick leave, vacation leave). Vacation leave is the only type with a
   real approve/deny workflow — Management approval, per Ken's request;
   everything else just gets read/unread, same as an inbox.
   ============================================================ */
var NOTIF_TYPES = {
  late: { label: 'Late', pill: 'pill-warn' },
  absence: { label: 'Absence', pill: 'pill-bad' },
  sick_leave: { label: 'Sick Leave', pill: 'pill-bad' },
  vacation_leave: { label: 'Vacation Leave', pill: 'pill-accent' },
  change_password: { label: 'Change Password', pill: 'pill-off' },
  set_password: { label: 'Set Password', pill: 'pill-off' },
  time_in: { label: 'Time In', pill: 'pill-good' },
  time_out: { label: 'Time Out', pill: 'pill-good' }
};
function notifTypePillHTML(type){
  var t = NOTIF_TYPES[type] || { label: type, pill: 'pill-off' };
  return '<span class="pill ' + t.pill + '">' + esc(t.label) + '</span>';
}
function fmtNotifWhen(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function adminNotificationsTab(){
  var filter = ui.notifFilter || 'all';
  var all = (STATE.notifications || []);
  var list = filter === 'all' ? all : all.filter(function(n){ return n.type === filter; });

  var filterOptions = '<option value="all">All notifications</option>' +
    Object.keys(NOTIF_TYPES).map(function(t){
      var sel = filter === t ? ' selected' : '';
      return '<option value="' + t + '"' + sel + '>' + esc(NOTIF_TYPES[t].label) + '</option>';
    }).join('');

  var rows = list.length ? list.map(function(n){
    var emp = getEmployee(n.empId);
    var empName = emp ? formatName(emp.name) : 'Unknown';
    var isVacation = n.type === 'vacation_leave';
    var isPending = isVacation && n.status === 'pending';
    var dateRange = (n.startDate || n.endDate)
      ? '<div class="muted" style="font-size:12px; margin-top:2px;">' + esc(n.startDate || '?') + ' – ' + esc(n.endDate || '?') + '</div>'
      : '';
    var vacationStatusPill = isVacation
      ? (n.status === 'approved' ? '<span class="pill pill-good">Approved</span>'
        : n.status === 'denied' ? '<span class="pill pill-bad">Denied</span>'
        : '<span class="pill pill-warn">Awaiting approval</span>')
      : '';
    return '<div class="card-pad notif-row" data-id="' + esc(n.id) + '" style="border:1px solid var(--line); border-radius:10px; padding:14px 16px; ' + (n.read ? '' : 'background:var(--bad-soft);') + '">' +
      '<div class="row" style="justify-content:space-between; align-items:flex-start; gap:10px;">' +
        '<div style="min-width:0;">' +
          '<div class="row" style="gap:8px; align-items:center;">' +
            (n.read ? '' : '<span title="Unread" style="width:8px; height:8px; border-radius:99px; background:var(--bad); flex:none;"></span>') +
            '<span style="font-weight:600; font-size:13.5px;">' + esc(empName) + '</span>' +
            notifTypePillHTML(n.type) +
            vacationStatusPill +
          '</div>' +
          '<div class="muted" style="font-size:12.5px; margin-top:4px;">' + esc(n.message || '') + '</div>' +
          dateRange +
          '<div class="muted" style="font-size:11px; margin-top:4px;">' + esc(fmtNotifWhen(n.createdAt)) + '</div>' +
          (n.adminReply ? '<div style="font-size:12.5px; margin-top:8px; padding:8px 10px; background:var(--surface-2); border-radius:7px;"><strong>Reply:</strong> ' + esc(n.adminReply) + '</div>' : '') +
        '</div>' +
        '<div class="stack" style="gap:6px; align-items:flex-end; flex:none;">' +
          '<button class="btn btn-sm btn-ghost" data-action="toggle-notification-read" data-id="' + esc(n.id) + '" data-read="' + (n.read ? '1' : '0') + '">' + (n.read ? 'Mark unread' : 'Mark read') + '</button>' +
        '</div>' +
      '</div>' +
      (isPending ?
        '<div class="stack" style="margin-top:10px; gap:8px;">' +
          '<textarea class="notif-reply" placeholder="Reply to ' + esc(empName.split(' ')[0]) + ' (optional)"></textarea>' +
          '<div class="row" style="justify-content:flex-end; gap:8px;">' +
            '<button class="btn btn-sm btn-danger" data-action="respond-notification" data-id="' + esc(n.id) + '" data-status="denied">Deny</button>' +
            '<button class="btn btn-sm btn-primary" data-action="respond-notification" data-id="' + esc(n.id) + '" data-status="approved">Approve</button>' +
          '</div>' +
        '</div>'
        : ''
      ) +
    '</div>';
  }).join('') : '<p class="empty">Nothing here.</p>';

  return '<div class="stack">' +
    '<div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
      '<select id="notif-filter-select" style="width:auto; min-width:200px;">' + filterOptions + '</select>' +
      '<div class="row" style="gap:8px;">' +
        '<button class="btn btn-sm" data-action="mark-all-notifications" data-read="1">Mark all as read</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="mark-all-notifications" data-read="0">Mark all as unread</button>' +
      '</div>' +
    '</div>' +
    '<div class="stack" style="gap:10px;">' + rows + '</div>' +
  '</div>';
}

/* Sort options for the People & Access employee table (ui.peopleSort).
   Surname sorts by surnameOf() so the two naming styles in this data
   ("Surname, First" and plain "First Surname") land in the same
   alphabetical order instead of the non-comma names sorting by first
   name. Department/Position group employees together by that field,
   breaking ties by surname so each group still reads alphabetically.
   No entry here for "unsorted" — ui.peopleSort starts as '' (the
   dropdown's blank placeholder option) and adminPeopleTab below leaves
   the list in its plain STATE.employees order whenever there's no
   PEOPLE_SORTS entry for the current value, rather than assuming
   Surname. */
var PEOPLE_SORTS = {
  surname: function(a,b){ return surnameOf(a.name).localeCompare(surnameOf(b.name)) || formatName(a.name).localeCompare(formatName(b.name)); },
  department: function(a,b){ return (a.department||'').localeCompare(b.department||'') || surnameOf(a.name).localeCompare(surnameOf(b.name)); },
  position: function(a,b){ return (a.position||'').localeCompare(b.position||'') || surnameOf(a.name).localeCompare(surnameOf(b.name)); }
};
function adminPeopleTab(){
  var peopleSort = ui.peopleSort || '';
  var sortCmp = PEOPLE_SORTS[peopleSort];
  // A plain <select> rather than the three-button row this used to be —
  // one dropdown to choose from, no separate button per option. Starts on
  // the blank placeholder (no sort applied) rather than jumping straight
  // to Surname, per Ken's request.
  var sortSelect = '<select id="people-sort-select" style="width:auto; min-width:160px;">' +
    '<option value=""' + (peopleSort === '' ? ' selected' : '') + '>Default order</option>' +
    [['surname','Surname'],['department','Department'],['position','Position']].map(function(s){
      var sel = peopleSort === s[0] ? ' selected' : '';
      return '<option value="' + s[0] + '"' + sel + '>' + s[1] + '</option>';
    }).join('') +
  '</select>';
  var sortedEmployees = sortCmp ? STATE.employees.slice().sort(sortCmp) : STATE.employees;
  var empRows = sortedEmployees.map(function(e){
    // No plaintext reveal here (unlike the claude.ai-hosted version): this
    // build stores passcodes only as one-way hashes, so even an admin can't
    // look one up — Reset is the only recovery path when someone forgets.
    var passcodeCell = e.passcodeSet ? '<span class="muted">Set</span>' : '<span class="muted">Not set</span>';
    return '<tr>' +
      '<td>' + esc(formatName(e.name)) + (e.active ? '' : ' <span class="pill pill-off">Inactive</span>') + '</td>' +
      '<td class="muted">' + esc(e.email || '—') + '</td>' +
      '<td>' + esc(e.department||'') + '</td>' +
      '<td>' + esc(e.position||'') + '</td>' +
      '<td><span class="badge-shift">' + esc(shiftName(e.shift)) + '</span></td>' +
      '<td>' + passcodeCell + '</td>' +
      '<td>' + (e.passcodeSet ? '<button class="btn btn-sm" data-action="reset-employee-passcode" data-id="' + esc(e.id) + '">Reset</button>' : '<span class="muted">—</span>') + '</td>' +
      '<td><button class="btn btn-sm" data-action="edit-employee-open" data-id="' + esc(e.id) + '">Edit</button></td>' +
      '<td>' + (e.active
          ? '<button class="btn btn-sm btn-danger" data-action="toggle-employee-active" data-id="' + esc(e.id) + '">Deactivate</button>'
          : '<button class="btn btn-sm" data-action="toggle-employee-active" data-id="' + esc(e.id) + '">Activate</button>') +
      '</td>' +
      '<td><button class="btn btn-sm btn-danger" data-action="delete-employee-open" data-id="' + esc(e.id) + '">Delete</button></td>' +
    '</tr>';
  }).join('');

  var adminRows = STATE.admins.map(function(a){
    var isPrimary = a === STATE.primaryAdmin;
    var email = (STATE.adminEmails && STATE.adminEmails[a]) || '';
    return '<tr>' +
      '<td>' + esc(a) + (isPrimary ? ' <span class="pill pill-accent">Primary</span>' : '') + '</td>' +
      '<td class="muted">' + esc(email || '—') + '</td>' +
      '<td><button class="btn btn-sm" data-action="edit-admin-open" data-name="' + esc(a) + '">Edit</button></td>' +
      '<td>' + (isPrimary ? '<span class="muted">Cannot be removed</span>' : '<button class="btn btn-sm btn-danger" data-action="remove-admin" data-name="' + esc(a) + '">Remove</button>') + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="stack" style="gap:22px;">' +
    '<div class="card">' +
      '<div class="card-pad row" style="justify-content:space-between; padding-bottom:12px;">' +
        '<h2 style="font-size:17px;">Employees</h2>' +
        '<button class="btn btn-sm btn-primary" data-action="add-employee-open">+ Add Employee</button>' +
      '</div>' +
      '<div class="card-pad row" style="align-items:center; gap:10px; padding-top:0; padding-bottom:12px;">' +
        '<label class="muted" for="people-sort-select" style="font-size:12px;">Sort by</label>' +
        sortSelect +
      '</div>' +
      '<div class="table-wrap" style="border:none; border-radius:0; border-top:1px solid var(--line);">' +
        '<table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Position</th><th>Shift</th><th>Passcode</th><th></th><th></th><th></th><th></th></tr></thead>' +
        '<tbody>' + empRows + '</tbody></table>' +
      '</div>' +
      '<div class="card-pad" style="padding-top:10px;"><p class="muted" style="margin:0; font-size:12px;">Each person sets their own passcode the first time they open the app. Reset clears it so they can set a new one — use this if someone forgets theirs. Deactivate keeps their full history and blocks them from logging in — they\'ll see a message to email ' + esc(REACTIVATION_EMAIL) + ' for reactivation. Delete is permanent and removes them and all their entries for good.</p></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-pad row" style="justify-content:space-between; padding-bottom:12px;">' +
        '<h2 style="font-size:17px;">Admins</h2>' +
        '<button class="btn btn-sm btn-primary" data-action="add-admin-open">+ Add Admin</button>' +
      '</div>' +
      '<div class="table-wrap" style="border:none; border-radius:0; border-top:1px solid var(--line);">' +

function wireInputsAfterRender(){
  var peopleSortSelect = $('people-sort-select');
  if(peopleSortSelect){
    peopleSortSelect.addEventListener('change', function(){
      ui.peopleSort = peopleSortSelect.value;
      render();
    });
  }
  var notifFilterSelect = $('notif-filter-select');
  if(notifFilterSelect){
    notifFilterSelect.addEventListener('change', function(){
      ui.notifFilter = notifFilterSelect.value;
      render();
    });
  }
  var adminEmpSearch = $('admin-emp-search');
  if(adminEmpSearch){
    adminEmpSearch.addEventListener('focus', function(){
      renderAdminEmpResults(adminEmpSearch.value);
    });
    adminEmpSearch.addEventListener('input', function(){
      renderAdminEmpResults(adminEmpSearch.value);
    });
    adminEmpSearch.addEventListener('keydown', function(e){
      var box = $('admin-emp-results');
      if(e.key === 'Escape'){
        if(box) box.hidden = true;
        return;
      }
      if(e.key === 'Enter'){
        e.preventDefault();
        if(box && !box.hidden){
          var first = box.querySelector('.autocomplete-item');
          if(first) pickAdminEmployee(first.getAttribute('data-emp-id'));
        }
      }
    });
    adminEmpSearch.addEventListener('blur', function(){
      // delay so a click/mousedown on a result can register first
      setTimeout(function(){
        var box = $('admin-emp-results');
        if(box) box.hidden = true;
      }, 150);
    });
  }
  var adminEmpResults = $('admin-emp-results');
  if(adminEmpResults){
    adminEmpResults.addEventListener('mousedown', function(e){
      var item = e.target.closest('.autocomplete-item');
      if(item) pickAdminEmployee(item.getAttribute('data-emp-id'));
    });
  }

  var landingSearch = $('landing-emp-search');
  if(landingSearch){
    landingSearch.addEventListener('focus', function(){
      renderLandingResults(landingSearch.value);
    });
    landingSearch.addEventListener('input', function(){
      ui.landingSearch.query = landingSearch.value;
      // typing invalidates a prior pick unless the text still matches it exactly
      var emp = ui.landingSearch.selectedId ? getEmployee(ui.landingSearch.selectedId) : null;
      if(!emp || formatName(emp.name) !== landingSearch.value){
        ui.landingSearch.selectedId = null;
        var hidden = $('landing-emp-selected-id');
        if(hidden) hidden.value = '';
      }
      renderLandingResults(landingSearch.value);
    });
    landingSearch.addEventListener('keydown', function(e){
      var box = $('landing-emp-results');
      if(e.key === 'Escape'){
        if(box) box.hidden = true;
        return;
      }
      if(e.key === 'Enter'){
        e.preventDefault();
        if(box && !box.hidden){
          var first = box.querySelector('.autocomplete-item');
          if(first) pickLandingEmployee(first.getAttribute('data-emp-id'));
        }
      }
    });
    landingSearch.addEventListener('blur', function(){
      // delay so a click/mousedown on a result can register first
      setTimeout(function(){
        var box = $('landing-emp-results');
        if(box) box.hidden = true;
      }, 150);
    });
  }
  var landingResults = $('landing-emp-results');
  if(landingResults){
    // mousedown (not click) fires before the input's blur handler runs,
    // so the pick registers before the results box gets hidden.
    landingResults.addEventListener('mousedown', function(e){
      var item = e.target.closest('.autocomplete-item');
      if(item) pickLandingEmployee(item.getAttribute('data-emp-id'));
    });
  }

  var firstInput = document.querySelector('.modal input, .modal textarea, .modal select');
  if(firstInput) firstInput.focus();

  wireEnterSubmit(['admin-login-pass'], 'admin-login-submit');
  wireEnterSubmit(['setup-passcode-1', 'setup-passcode-2'], 'employee-setup-submit');
  wireEnterSubmit(['auth-passcode'], 'employee-auth-submit');
  wireModalEnterSubmit();

  var restoreInput = $('restore-backup-input');
  if(restoreInput){
    restoreInput.addEventListener('change', function(){
      var file = restoreInput.files && restoreInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try{ parsed = JSON.parse(reader.result); }catch(parseErr){
          toast('That file isn’t valid backup data.', 'error');
          return;
        }
        if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.employees) || typeof parsed.entries !== 'object'){
          toast('That file doesn’t look like an SDI Timesheet backup.', 'error');
          return;
        }
        ui.modal = 'restoreBackupConfirm';
        ui.modalData = { pendingState: parsed };
        render();
      };
      reader.onerror = function(){ toast('Couldn’t read that file.', 'error'); };
      reader.readAsText(file);
    });
  }
}

/* Lets Enter submit a field the same way clicking its button does, for the
   handful of single-field/short forms (login, passcode setup/entry) where
   users expect that. */
function wireEnterSubmit(ids, action){
  ids.forEach(function(id){
    var el = $(id);
    if(!el) return;
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        var fn = handlers[action];
        if(fn) fn();
      }
    });
  });
}

/* Lets Enter submit whichever modal is open, from any of its single-line
   fields — same idea as wireEnterSubmit but modal-generic instead of a
   fixed id list, since every modal already follows one shape: a Cancel
   button plus exactly one primary/danger button carrying the real
   data-action. Textareas are deliberately left out (Enter should insert a
   newline there, e.g. the "Raise a concern" modal), and this only wires
   whatever modal is on screen right now, so it's safe to call on every
   render — a modal with no matching button or fields is a no-op. */
function wireModalEnterSubmit(){
  var modalEl = document.querySelector('.modal');
  if(!modalEl) return;
  var primaryBtn = modalEl.querySelector('[data-action]:not([data-action="close-modal"])');
  if(!primaryBtn) return;
  var action = primaryBtn.getAttribute('data-action');
  var fields = modalEl.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], input[type="number"]');
  fields.forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        var fn = handlers[action];
        if(fn) fn();
      }
    });
  });
}

var handlers = {
  'reload-page': function(){ location.reload(); },
  'go-landing': function(){
    if(session.token) callApi('logout', { token: session.token }).catch(function(){});
    stopPolling();
    session = { role: null, employeeId: null, adminName: null, token: null };
    ui.landingSearch = { query: '', selectedId: null, error: null };
    saveSession(); ui.modal = null; ui.modalData = {};
    DATA_READY = false; render(); loadInitialData();
  },
  'landing-view-employee': function(){
    var empId = ui.landingSearch.selectedId;
    if(!empId){
      ui.landingSearch.error = 'Search for your name and pick it from the list first.';
      render();
      return;
    }
    var emp = getEmployee(empId);
    if(!emp) return;
    if(!emp.active){
      ui.landingSearch = { query: '', selectedId: null, error: null };
      ui.modal = 'accountInactive';
      ui.modalData = {};
      render();
      return;
    }
    ui.modalData = {};
    if(emp.passcodeSet){
      session = { role: 'employee-auth', pendingEmployeeId: emp.id, employeeId: null, adminName: null, token: null };
    } else {
      session = { role: 'employee-setup', pendingEmployeeId: emp.id, employeeId: null, adminName: null, token: null };
    }
    ui.landingSearch = { query: '', selectedId: null, error: null };

  /* Deliberately does NOT call render(): the Edit Entries table holds a
     whole month of unsaved edits in plain DOM inputs (nothing is written
     back to STATE until Save Changes), same as typing into any of its
     other fields. A render() here would redraw the table from STATE and
     silently wipe out every other row's in-progress edit, not just clear
     this one field. */
  'clear-time-field': function(el){
    var td = el.closest('td');
    var input = td && td.querySelector('input[type="time"]');
    if(input){ input.value = ''; input.focus(); }
  },
  /* Same no-render reasoning as clear-time-field above — this only
     touches its own row's inputs directly in the DOM. */
  'clear-entry-row': function(el){
    var tr = el.closest('tr');
    if(!tr) return;
    var status = tr.querySelector('.entry-status');
    var timeIn = tr.querySelector('.entry-timein');
    var timeOut = tr.querySelector('.entry-timeout');
    var minLate = tr.querySelector('.entry-minlate');
    var notes = tr.querySelector('.entry-notes');
    if(status) status.value = '';
    if(timeIn) timeIn.value = '';
    if(timeOut) timeOut.value = '';
    if(minLate) minLate.value = '';
    if(notes) notes.value = '';
  },
  'admin-goto-entries': function(el){ ui.adminEmpId = el.dataset.id; ui.adminTab = 'entries'; render(); },
  'save-entries': function(){
    var empId = ui.adminEmpId;
    if(!empId) return;
    var monthKey = adminMonth();
    var table = $('entries-editor-table');
    if(!table) return;
    var emp = getEmployee(empId);
    var requiredTimeIn = emp ? shiftRequiredTimeIn(emp.shift) : null;
    var patches = {};
    table.querySelectorAll('tbody tr').forEach(function(tr){
      var day = tr.getAttribute('data-day');
      var status = tr.querySelector('.entry-status').value || null;
      var timeIn = tr.querySelector('.entry-timein').value || null;
      var timeOut = tr.querySelector('.entry-timeout').value || null;
      var minLateVal = tr.querySelector('.entry-minlate').value;
      var minutesLate = (status === 'L' && minLateVal !== '') ? parseInt(minLateVal, 10) : null;
      // Auto-detect lateness from the typed-in time the same way an
      // employee's own punch does, so admins don't have to remember to
      // pick "Late" by hand every time they type a time past the shift's
      // required time-in. A status the admin explicitly set to Absent is
      // left alone; a Min Late the admin already typed by hand (alongside
      // picking Late themselves) is treated as a deliberate manual
      // override and left as typed, not recalculated.
      if(status !== 'A' && minutesLate === null && timeIn && requiredTimeIn){
        var diff = toMinutesOfDay(timeIn) - toMinutesOfDay(requiredTimeIn);
        if(diff > 0){ status = 'L'; minutesLate = diff; }
      }
      var notes = tr.querySelector('.entry-notes').value || null;
      patches[day] = { status: status, timeIn: timeIn, timeOut: timeOut, minutesLate: minutesLate, notes: notes };
    });
    apiPersist('save-entries', { token: session.token, employeeId: empId, monthKey: monthKey, patches: patches },
      function(s){ Object.keys(patches).forEach(function(day){ setEntry(empId, monthKey, day, patches[day]); }); },
      { successMsg: 'Entries saved' });
  },

  'download-attendance-grid': function(){ var mk = adminMonth(); offerDownload('SDI_Attendance_Grid_' + mk, attendanceGridExcelHTML(mk), 'html'); },
  'export-backup': function(){
    var json = JSON.stringify(STATE, null, 2);
    var stamp = new Date().toISOString().slice(0, 10);
    offerDownload('SDI_Timesheet_Backup_' + stamp, json, 'json');
  },
  'restore-backup-submit': function(){
    var pending = ui.modalData.pendingState;
    ui.modal = null;
    ui.modalData = {};
    if(!pending) return;
    callApi('restore-backup', { token: session.token, backup: pending }).then(function(data){
      applyServerState(data);
      toast('Data restored from backup', 'success');
      render();
    }).catch(function(err){
      toast(apiErrorMessage(err), 'error');
    });
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var fn = handlers[el.dataset.action];
  if(fn) fn(el, e);
});

/* ============================================================
   BOOT
   ============================================================ */
if(BOOT_FATAL_NOTE){
  // Nothing usable to render an app around — show the recovery screen
  // directly rather than letting downstream code touch an empty STATE.
  var bootApp = $('app');
  if(bootApp) bootApp.innerHTML = renderFatalErrorHTML(BOOT_FATAL_NOTE);
} else {
  render(); // shows the loading screen (DATA_READY starts false)
  if(BOOT_RECOVERY_NOTE) toast(BOOT_RECOVERY_NOTE, 'error');
  loadInitialData();
}
console.log('SDI Timesheet: booting');
})();

</script>
